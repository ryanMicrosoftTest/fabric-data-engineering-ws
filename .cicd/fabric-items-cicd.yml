# fabric-items-deployment-pipeline
# =================================
# Deploys all fabric_items to the target Fabric workspace, patches the
# Environment with the exact onelake-security package version, then validates
# by running the onelake_security_role_pl pipeline.
#
# Triggers:
#   1. Direct CI on changes under fabric_items/**
#   2. Explicit queue from onelake-security-role-service-pipeline (via az pipelines run)
#
# When a single commit changes BOTH fabric_items/** AND onelake-security-role-service/**,
# the upstream onelake-security-role-service-pipeline will queue this pipeline
# explicitly. The PreflightCheck stage below detects that case and skips the
# CI-triggered run so the deployment only fires once.

trigger:
  batch: true
  branches:
    include:
      - main
      - feature/*
      - release/*
      - copilot/*
  paths:
    include:
      - 'fabric_items/**'

pr: none

resources:
  repositories:
  - repository: fabric-cicd-demo
    type: github
    endpoint: RyanMicrosoftContosoUniversity
    name: RyanMicrosoftContosoUniversity/fabric-cicd-demo
    ref: main
  pipelines:
    # Resource is required so the deploy job can `download:` artifacts from the
    # latest onelake-security-role-service-pipeline run. NO trigger here — the
    # upstream pipeline queues us explicitly via `az pipelines run` to pass the
    # deployment environment parameter.
    - pipeline: onelakeSecurityPkg
      source: onelake-security-role-service-pipeline   # ADO display name of the upstream pipeline

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: Deployment Environment
    type: string
    default: 'QA'
    values:
      - 'DEV'
      - 'QA'
      - 'PROD'

variables:
  - name: targetEnvironment
    value: ${{ parameters.environment }}
  - name: FEED_CONNECTION_ID
    value: '472fe7a1-c6d3-4f4f-b2b5-f8bcaf988310'

stages:
- stage: PreflightCheck
  displayName: 'Preflight: dedupe CI run'
  jobs:
  - job: ShouldRun
    displayName: 'Decide whether to run deployment'
    steps:
    - checkout: self
      fetchDepth: 2
      displayName: 'Checkout (shallow, for diff)'
    - bash: |
        set -euo pipefail
        SKIP=false
        REASON="$(Build.Reason)"
        echo "Build.Reason: $REASON"

        if [[ "$REASON" == "IndividualCI" || "$REASON" == "BatchedCI" ]]; then
          # CI trigger fired because fabric_items/** changed. If the same commit
          # also touched onelake-security-role-service/**, the upstream pipeline
          # will queue this pipeline explicitly — skip this CI run to avoid a
          # duplicate deployment.
          CHANGED=$(git diff-tree --no-commit-id --name-only -r "$(Build.SourceVersion)" 2>/dev/null || true)
          echo "Changed files in $(Build.SourceVersion):"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^onelake-security-role-service/"; then
            echo "##[warning]onelake-security-role-service/** also changed in this commit."
            echo "##[warning]onelake-security-role-service-pipeline will queue this pipeline explicitly. Skipping CI run."
            SKIP=true
          fi
        fi

        echo "skip=$SKIP"
        echo "##vso[task.setvariable variable=skip;isOutput=true]$SKIP"
      name: gate
      displayName: 'Check for duplicate trigger'

- stage: DeployFabricItems
  displayName: 'Deploy Fabric Items'
  dependsOn: PreflightCheck
  condition: and(succeeded(), ne(dependencies.PreflightCheck.outputs['ShouldRun.gate.skip'], 'true'))
  jobs:
  - job: PatchAndDeploy
    displayName: 'Patch Environment, Deploy & Validate'
    timeoutInMinutes: 360
    steps:
    # Checkout the current repository
    - checkout: self
      fetchDepth: 1
      path: s/current-repo
      displayName: 'Checkout current repository'

    # Checkout the external repository
    - checkout: fabric-cicd-demo
      fetchDepth: 1
      path: s/fabric-cicd-demo
      displayName: 'Checkout fabric-cicd-demo repository'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        addToPath: true
      displayName: 'Set up Python'

    # Download metadata from onelake-security-role-service-pipeline
    - download: onelakeSecurityPkg
      artifact: package_metadata
      displayName: 'Download package metadata from onelake-security-role-service-pipeline'

    # Install pyyaml early — needed by patch_onelake_env.py
    - script: |
        python -m pip install pyyaml
      displayName: 'Install pyyaml for environment patch'

    # Patch inline so a missing package entry does not require script changes.
    - bash: |
        set -euo pipefail
        python - <<'PY'
        import json
        import os
        import re
        from pathlib import Path
        import yaml

        metadata = json.loads(Path(os.environ["PACKAGE_METADATA_FILE"]).read_text(encoding="utf-8"))
        version = metadata["packageVersion"]
        feed = os.environ["FEED_CONNECTION_ID"]
        if not isinstance(version, str) or not version.strip():
            raise ValueError("Package metadata must contain a nonempty packageVersion")
        if not feed.strip() or feed.startswith("$("):
            raise ValueError("FEED_CONNECTION_ID is empty or unresolved")

        env_file = Path("fabric_items/onelake_security_utils.Environment/Libraries/PublicLibraries/environment.yml")
        doc = yaml.safe_load(env_file.read_text(encoding="utf-8"))
        if not isinstance(doc, dict) or not isinstance(doc.get("dependencies"), list):
            raise ValueError("environment.yml must contain a dependencies list")

        package_found = False
        index_found = False
        pip_groups = []
        for dep in doc["dependencies"]:
            if not isinstance(dep, dict) or "pip" not in dep:
                continue
            entries = dep["pip"]
            if not isinstance(entries, list):
                raise ValueError("environment.yml pip dependencies must be a list")
            pip_groups.append(entries)
            for i, entry in enumerate(entries):
                if not isinstance(entry, str):
                    raise ValueError("Each pip dependency must be a string")
                if re.match(r"^onelake[-_.]+security(?=\s|[<>=!~;\[@]|$)", entry.lstrip(), re.IGNORECASE):
                    entries[i] = f"onelake-security=={version}"
                    package_found = True
                elif re.match(r"^--index-url(?:\s|=|$)", entry.lstrip()):
                    entries[i] = f"--index-url {feed}"
                    index_found = True

        if not index_found:
            raise ValueError("environment.yml must contain a pip --index-url entry")
        if not package_found:
            pip_groups[0].append(f"onelake-security=={version}")
            print("Added missing onelake-security pip entry")

        env_file.write_text(yaml.safe_dump(doc, sort_keys=False), encoding="utf-8")
        print(f"Updated environment.yml to onelake-security=={version}")
        PY
      displayName: 'Patch onelake_security_utils environment.yml'
      workingDirectory: '$(Pipeline.Workspace)/s/current-repo'
      env:
        FEED_CONNECTION_ID: $(FEED_CONNECTION_ID)
        PACKAGE_METADATA_FILE: '$(Pipeline.Workspace)/onelakeSecurityPkg/package_metadata/package-metadata.json'

    # ...existing code...
    - task: AzureKeyVault@2
      condition: or(eq(variables['targetEnvironment'], 'DEV'), eq(variables['targetEnvironment'], 'QA'))
      inputs:
        azureSubscription: 'fabric-sc'
        KeyVaultName: '$(KeyVaultNameNonProd)'
        SecretsFilter: 'tenant-id-secret, fabric-non-prod-spn-secret, fabric-non-prod-spn-client-secret'
      displayName: 'Get Key Vault Secrets (DEV/QA)'

    - task: AzureKeyVault@2
      condition: eq(variables['targetEnvironment'], 'PROD')
      inputs:
        azureSubscription: 'fabric-sc-prod'
        KeyVaultName: '$(KeyVaultNameProd)'
        SecretsFilter: 'tenantID, fabric-prod-secret, fabric-prod-spn-client-secret'
      displayName: 'Get Key Vault Secrets (PROD)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r $(Build.SourcesDirectory)/fabric-cicd-demo/.cicd/requirements.txt
        pip install pyyaml requests msal
      displayName: 'Install dependencies'

    # Show repository contents
    - script: |
        echo "Current repo directory:"
        ls -la $(Build.SourcesDirectory)/current-repo
        echo "External repo directory:"
        ls -la $(Build.SourcesDirectory)/fabric-cicd-demo
      displayName: 'Show repository contents'

    - script: |
        echo "Target Environment: $(targetEnvironment)"
        echo "Working Directory: $(Build.SourcesDirectory)"
        ls -a
        ls -a fabric_items
        python $(Build.SourcesDirectory)/fabric-cicd-demo/.cicd/authenticate_spn.py $(targetEnvironment) $(Build.SourcesDirectory)/current-repo/attached_config/target_deployment.yml
      condition: or(eq(variables['targetEnvironment'], 'DEV'), eq(variables['targetEnvironment'], 'QA'))
      workingDirectory: $(Build.SourcesDirectory)/current-repo/
      env:
        AZURE_CLIENT_ID: $(fabric-non-prod-spn-client-secret)
        AZURE_TENANT_ID: $(tenant-id-secret)
        AZURE_CLIENT_SECRET: $(fabric-non-prod-spn-secret)
        FABRIC_CICD_RETRY_MAX_DURATION_SECONDS: 900
      displayName: 'Run authentication and deployment script (DEV/QA)'

    - script: |
        echo "Target Environment: $(targetEnvironment)"
        echo "Working Directory: $(Build.SourcesDirectory)"
        ls -a
        ls -a fabric_items
        python $(Build.SourcesDirectory)/fabric-cicd-demo/.cicd/authenticate_spn.py $(targetEnvironment) $(Build.SourcesDirectory)/current-repo/attached_config/target_deployment.yml
      condition: eq(variables['targetEnvironment'], 'PROD')
      workingDirectory: $(Build.SourcesDirectory)/current-repo/
      env:
        AZURE_CLIENT_ID: $(fabric-prod-spn-client-secret)
        AZURE_TENANT_ID: $(tenantID)
        AZURE_CLIENT_SECRET: $(fabric-prod-secret)
        FABRIC_CICD_RETRY_MAX_DURATION_SECONDS: 900
      displayName: 'Run authentication and deployment script (PROD)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/current-repo/fabric_cicd.error.log'
        ArtifactName: 'errorlog'
        publishLocation: 'Container'
      condition: always()
      displayName: 'Publish error log artifact'

    # Run the validation Fabric pipeline and poll for success
    - script: |
        WORKSPACE_ID=$(python -c "
        import yaml
        with open('$(Build.SourcesDirectory)/current-repo/attached_config/target_deployment.yml') as f:
            cfg = yaml.safe_load(f)
        print(cfg['$(targetEnvironment)']['target_workspace_id'])
        ")
        echo "Resolved workspace ID for $(targetEnvironment): $WORKSPACE_ID"
        python $(Build.SourcesDirectory)/current-repo/.cicd/scripts/run_fabric_pipeline.py \
          --workspace-id "$WORKSPACE_ID" \
          --pipeline-name "onelake_security_role_pl" \
          --poll-interval 30 \
          --timeout 3600
      condition: in(variables['targetEnvironment'], 'DEV', 'QA')
      displayName: 'Run and validate onelake_security_role_pl ($(targetEnvironment))'
      env:
        AZURE_CLIENT_ID: $(fabric-non-prod-spn-client-secret)
        AZURE_TENANT_ID: $(tenant-id-secret)
        AZURE_CLIENT_SECRET: $(fabric-non-prod-spn-secret)
