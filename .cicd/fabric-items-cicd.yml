# fabric-items-deployment-pipeline
# =================================
# Patches the onelake_security_utils Environment, deploys fabric_items,
# then validates DEV/QA by running onelake_security_role_pl.
#
# When the same commit changes both fabric_items/** and
# onelake-security-role-service/**, skip this pipeline's CI-triggered run.
# The upstream service pipeline queues deployment explicitly.

trigger:
  batch: true
  branches:
    include:
      - main
      - feature/*
      - release/*
      - copilot/*
  paths:
    include:
      - 'fabric_items/**'

pr: none

resources:
  repositories:
    - repository: fabric-cicd-demo
      type: github
      endpoint: RyanMicrosoftContosoUniversity
      name: RyanMicrosoftContosoUniversity/fabric-cicd-demo
      ref: main

  pipelines:
    # Used to download package metadata. The upstream pipeline queues
    # deployment explicitly; there is no completion trigger here.
    - pipeline: onelakeSecurityPkg
      source: onelake-security-role-service-pipeline

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: Deployment Environment
    type: string
    default: 'QA'
    values:
      - 'DEV'
      - 'QA'
      - 'PROD'

variables:
  - name: targetEnvironment
    value: ${{ parameters.environment }}

  - name: FEED_CONNECTION_ID
    value: '472fe7a1-c6d3-4f4f-b2b5-f8bcaf988310'

stages:
  - stage: PreflightCheck
    displayName: 'Preflight: dedupe CI run'
    jobs:
      - job: ShouldRun
        displayName: 'Decide whether to run deployment'
        steps:
          - checkout: self
            fetchDepth: 2
            displayName: 'Checkout (shallow, for diff)'

          - bash: |
              set -euo pipefail
              SKIP=false
              REASON="$(Build.Reason)"
              echo "Build.Reason: $REASON"

              if [[ "$REASON" == "IndividualCI" || "$REASON" == "BatchedCI" ]]; then
                CHANGED=$(git diff-tree --no-commit-id --name-only -r "$(Build.SourceVersion)" 2>/dev/null || true)
                echo "Changed files in $(Build.SourceVersion):"
                echo "$CHANGED"

                if echo "$CHANGED" | grep -q "^onelake-security-role-service/"; then
                  echo "##[warning]onelake-security-role-service/** also changed in this commit."
                  echo "##[warning]The upstream service pipeline will queue deployment explicitly. Skipping this CI run."
                  SKIP=true
                fi
              fi

              echo "skip=$SKIP"
              echo "##vso[task.setvariable variable=skip;isOutput=true]$SKIP"
            name: gate
            displayName: 'Check for duplicate trigger'

  - stage: DeployFabricItems
    displayName: 'Deploy Fabric Items'
    dependsOn: PreflightCheck
    condition: and(succeeded(), ne(dependencies.PreflightCheck.outputs['ShouldRun.gate.skip'], 'true'))
    jobs:
      - job: PatchAndDeploy
        displayName: 'Patch Environment, Deploy & Validate'
        timeoutInMinutes: 360
        steps:
          - checkout: self
            fetchDepth: 1
            path: s/current-repo
            displayName: 'Checkout current repository'

          - checkout: fabric-cicd-demo
            fetchDepth: 1
            path: s/fabric-cicd-demo
            displayName: 'Checkout fabric-cicd-demo repository'

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
              addToPath: true
            displayName: 'Set up Python'

          # Install once, before any Python patching or deployment scripts.
          - bash: |
              set -euo pipefail
              python -m pip install --upgrade pip
              python -m pip install -r "$(Pipeline.Workspace)/s/fabric-cicd-demo/.cicd/requirements.txt"
              python -m pip install pyyaml requests msal
              python -c "from azure.identity import ClientSecretCredential; import fabric_cicd; import yaml; import requests; import msal"
            displayName: 'Install dependencies'

          - download: onelakeSecurityPkg
            artifact: package_metadata
            displayName: 'Download package metadata from onelake-security-role-service-pipeline'

          - bash: |
              set -euo pipefail

              if [[ -z "${FEED_CONNECTION_ID:-}" || "$FEED_CONNECTION_ID" == '$('* ]]; then
                echo "##[error]FEED_CONNECTION_ID is empty or unresolved."
                exit 1
              fi

              echo "Source branch: $(Build.SourceBranch)"
              echo "Source commit: $(Build.SourceVersion)"
              echo "Checked-out commit: $(git rev-parse HEAD)"
              echo "Patching fabric_items/onelake_security_utils.Environment/Libraries/PublicLibraries/environment.yml"

              python .cicd/scripts/patch_onelake_env.py
            displayName: 'Patch onelake_security_utils environment.yml'
            workingDirectory: '$(Pipeline.Workspace)/s/current-repo'
            env:
              FEED_CONNECTION_ID: $(FEED_CONNECTION_ID)
              PACKAGE_METADATA_FILE: '$(Pipeline.Workspace)/onelakeSecurityPkg/package_metadata/package-metadata.json'

          - task: AzureKeyVault@2
            condition: and(succeeded(), in(variables['targetEnvironment'], 'DEV', 'QA'))
            inputs:
              azureSubscription: 'fabric-sc'
              KeyVaultName: '$(KeyVaultNameNonProd)'
              SecretsFilter: 'tenant-id-secret,fabric-non-prod-spn-secret,fabric-non-prod-spn-client-secret'
            displayName: 'Get Key Vault Secrets (DEV/QA)'

          - task: AzureKeyVault@2
            condition: and(succeeded(), eq(variables['targetEnvironment'], 'PROD'))
            inputs:
              azureSubscription: 'fabric-sc-prod'
              KeyVaultName: '$(KeyVaultNameProd)'
              SecretsFilter: 'tenantID,fabric-prod-secret,fabric-prod-spn-client-secret'
            displayName: 'Get Key Vault Secrets (PROD)'

          - bash: |
              set -euo pipefail
              echo "Target Environment: $(targetEnvironment)"
              echo "Working Directory: $PWD"

              python "$(Pipeline.Workspace)/s/fabric-cicd-demo/.cicd/authenticate_spn.py" \
                "$(targetEnvironment)" \
                "$(Pipeline.Workspace)/s/current-repo/attached_config/target_deployment.yml"
            condition: and(succeeded(), in(variables['targetEnvironment'], 'DEV', 'QA'))
            workingDirectory: '$(Pipeline.Workspace)/s/current-repo'
            env:
              AZURE_CLIENT_ID: $(fabric-non-prod-spn-client-secret)
              AZURE_TENANT_ID: $(tenant-id-secret)
              AZURE_CLIENT_SECRET: $(fabric-non-prod-spn-secret)
              FABRIC_CICD_RETRY_MAX_DURATION_SECONDS: '900'
            displayName: 'Run authentication and deployment script (DEV/QA)'

          - bash: |
              set -euo pipefail
              echo "Target Environment: $(targetEnvironment)"
              echo "Working Directory: $PWD"

              python "$(Pipeline.Workspace)/s/fabric-cicd-demo/.cicd/authenticate_spn.py" \
                "$(targetEnvironment)" \
                "$(Pipeline.Workspace)/s/current-repo/attached_config/target_deployment.yml"
            condition: and(succeeded(), eq(variables['targetEnvironment'], 'PROD'))
            workingDirectory: '$(Pipeline.Workspace)/s/current-repo'
            env:
              AZURE_CLIENT_ID: $(fabric-prod-spn-client-secret)
              AZURE_TENANT_ID: $(tenantID)
              AZURE_CLIENT_SECRET: $(fabric-prod-secret)
              FABRIC_CICD_RETRY_MAX_DURATION_SECONDS: '900'
            displayName: 'Run authentication and deployment script (PROD)'

          - bash: |
              set -euo pipefail

              WORKSPACE_ID=$(python -c "
              import os
              import yaml
              with open('attached_config/target_deployment.yml', encoding='utf-8') as f:
                  cfg = yaml.safe_load(f)
              workspace_id = cfg[os.environ['TARGET_ENVIRONMENT']]['target_workspace_id']
              if not isinstance(workspace_id, str) or not workspace_id.strip():
                  raise ValueError('target_workspace_id must be a nonempty string')
              print(workspace_id)
              ")

              echo "Resolved workspace ID for $(targetEnvironment): $WORKSPACE_ID"

              python .cicd/scripts/run_fabric_pipeline.py \
                --workspace-id "$WORKSPACE_ID" \
                --pipeline-name "onelake_security_role_pl" \
                --poll-interval 30 \
                --timeout 3600
            condition: and(succeeded(), in(variables['targetEnvironment'], 'DEV', 'QA'))
            displayName: 'Run and validate onelake_security_role_pl ($(targetEnvironment))'
            workingDirectory: '$(Pipeline.Workspace)/s/current-repo'
            env:
              TARGET_ENVIRONMENT: $(targetEnvironment)
              AZURE_CLIENT_ID: $(fabric-non-prod-spn-client-secret)
              AZURE_TENANT_ID: $(tenant-id-secret)
              AZURE_CLIENT_SECRET: $(fabric-non-prod-spn-secret)

          # Early failures may occur before fabric-cicd creates an error log.
          - bash: |
              set -euo pipefail

              if [[ -f "$(Pipeline.Workspace)/s/current-repo/fabric_cicd.error.log" ]]; then
                echo "##vso[task.setvariable variable=hasErrorLog;isOutput=true]true"
              else
                echo "No fabric_cicd.error.log was generated."
                echo "##vso[task.setvariable variable=hasErrorLog;isOutput=true]false"
              fi
            name: detectErrorLog
            condition: always()
            displayName: 'Locate deployment error log'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Pipeline.Workspace)/s/current-repo/fabric_cicd.error.log'
              ArtifactName: 'errorlog'
              publishLocation: 'Container'
            condition: and(always(), eq(variables['detectErrorLog.hasErrorLog'], 'true'))
            displayName: 'Publish error log artifact'