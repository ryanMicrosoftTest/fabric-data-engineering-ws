[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "medallion-fabric-airflow"
version = "0.1.0"
description = "SQL-driven Microsoft Fabric notebook operator for Fabric Managed Airflow"
requires-python = ">=3.12,<3.14"
dependencies = [
    "msal>=1.31,<2",
    "pyodbc>=5.2,<6",
    "requests>=2.32,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]